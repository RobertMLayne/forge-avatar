[metadata]
name = avatar-toolkit
version = 1.0.0
description = Fast CLI + GUI avatar generator
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Robert M. Layne, Ph.D.

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    opencv-python-headless>=4.9.0.80
    Pillow>=10.0.0
    numpy>=1.24.4
    tkinterdnd2>=0.3.0

[options.entry_points]
console_scripts =
    avatargen = avatar_toolkit.cli:main
