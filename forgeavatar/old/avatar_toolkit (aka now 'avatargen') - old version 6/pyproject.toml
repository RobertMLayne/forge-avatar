[project]
name = "avatar-toolkit"
version = "1.0.0"
description = "Fast CLI + GUI toolkit for cropping faces and generating polished avatars"
requires-python = ">=3.8"
dependencies = [
    "opencv-python-headless>=4.5.0",
    "Pillow>=9.0.0",
    "tkinterdnd2>=0.3.0",
]

[project.urls]
homepage = "https://github.com/doctordesh/avatargen"

[project.authors]
name = "Robert M. Layne, Ph.D."
email = "robert@layneip.tech"
